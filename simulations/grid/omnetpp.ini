[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 1s
**.cmdenv-log-level = info

image-path = ../../images

network = emergencynavigation.scenario.EmergencyGridScenario

##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = true
print-undisposed = true

sim-time-limit = 900s

**.scalar-recording = true
**.vector-recording = true

*.playgroundSizeX = 1000m
*.playgroundSizeY = 1000m
*.playgroundSizeZ = 50m


##########################################################
# Annotation parameters                                  #
##########################################################
*.annotations.draw = true

##########################################################
# Obstacle parameters                                    #
##########################################################

##########################################################
#            TraCIScenarioManager parameters             #
##########################################################
*.manager.updateInterval = 0.5s
*.manager.host = "localhost"
*.manager.port = 9998
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("grid.launchd.xml")
*.manager.trafficLightModuleType = "emergencynavigation.scenario.ControlledTrafficLight"
*.manager.moduleType = "emergency=emergencynavigation.scenario.EmergencyCar *=emergencynavigation.scenario.NormalCar"
*.manager.moduleName = "emergency=node *=node"
*.manager.moduleDisplayString = ""

*.tls[*].mobility.x = 0
*.tls[*].mobility.y = 0
*.tls[*].mobility.z = 3

*.tls[*].applType = "org.car2x.veins.modules.application.traci.TraCIDemoTrafficLightApp"
*.tls[*].logicType ="org.car2x.veins.modules.world.traci.trafficLight.logics.TraCITrafficLightSimpleLogic"


##########################################################
#                       RSU SETTINGS                     #
#                                                        #
#                                                        #
##########################################################
*.rsu[0].mobility.x = 100
*.rsu[0].mobility.y = 850
*.rsu[1].mobility.x = 450
*.rsu[1].mobility.y = 450
*.rsu[2].mobility.x = 870
*.rsu[2].mobility.y = 80
*.rsu[*].mobility.z = 3

*.rsu[*].applType = "emergencynavigation.apps.RsuApp"
*.rsu[*].appl.headerLength = 80 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].appl.beaconInterval = 1s
*.rsu[*].appl.beaconUserPriority = 7
*.rsu[*].appl.dataUserPriority = 5
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m

##########################################################
#            11p specific parameters                     #
#                                                        #
#                    NIC-Settings                        #
##########################################################
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 650m
*.connectionManager.drawMaxIntfDist = false

*.**.nic.mac1609_4.useServiceChannel = false

*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.minPowerLevel = -110dBm

*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm

*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml")
*.**.nic.phy80211p.usePropagationDelay = true

*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m

##########################################################
#                      App Layer                         #
##########################################################
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconInterval = 1s

##########################################################
#                      Mobility                          #
##########################################################
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false

*.rsu[2].appl.accidentDetector = true
*.**.appl.maxHops = 10
*.node[*].appl.trafficBeaconInterval = 1s
*.rsu[*].appl.trafficStatusInterval = 1s
*.node[*].appl.dynamicUpdateInterval = 5s
*.node[*].appl.congestionSpeedThreshold = 0.3
*.node[*].appl.minimumRouteImprovement = 0.1
*.node[*].appl.densityLambda = 0.5
*.node[*].appl.watchdogThreshold = 800ms
*.node[*].mist.routeBaseDelay = 300ms
*.node[*].mist.routeNodeDelay = 2ms
*.rsu[*].fog.routeBaseDelay = 300ms
*.rsu[*].fog.routeNodeDelay = 2ms
*.cloud.routeBaseDelay = 300ms
*.cloud.routeNodeDelay = 2ms
*.cloud.backhaulDelay = 150ms
*.tls[*].controller.controlProcessingDelay = 150ms
*.tls[*].controller.yellowDuration = 2s
*.tls[*].controller.allRedDuration = 1s
*.tls[*].controller.maximumHold = 25s

[Config Default]

[Config Smoke]
extends = Default
sim-time-limit = 120s
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-Smoke.csv"

[Config DirectDelivery]
extends = Smoke
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-DirectDelivery.csv"
*.connectionManager.maxInterfDist = 1600m
*.**.nic.mac1609_4.txPower = 1W
*.node[*].appl.relayEnabled = false
*.rsu[0].appl.relayEnabled = false
*.rsu[1].appl.relayEnabled = false

[Config VehicleRelay]
extends = Smoke
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-VehicleRelay.csv"
*.rsu[0].appl.relayEnabled = false
*.rsu[1].appl.relayEnabled = false

[Config RsuRelay]
extends = Smoke
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-RsuRelay.csv"
*.node[*].appl.relayEnabled = false
*.rsu[*].nic.mac1609_4.txPower = 1W

[Config TtlOne]
extends = Smoke
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-TtlOne.csv"
*.**.appl.maxHops = 1

[Config FogCloudAStar]
extends = Default
*.metrics.mobilityLogPath = "../../artifacts/logs/mobility-FogCloudAStar-verified.csv"
*.tls[*].controller.trafficLightLogPath = "../../artifacts/logs/traffic-light-FogCloudAStar-verified.csv"
*.node[*].appl.routingMode = "fog_cloud"
*.node[*].appl.dynamicRouting = false
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-FogCloudAStar-verified.csv"
*.node[*].appl.routingLogPath = "../../artifacts/logs/routing-FogCloudAStar-verified.csv"

[Config MistAStar]
extends = Default
*.metrics.mobilityLogPath = "../../artifacts/logs/mobility-MistAStar-verified.csv"
*.tls[*].controller.trafficLightLogPath = "../../artifacts/logs/traffic-light-MistAStar-verified.csv"
*.node[*].appl.routingMode = "mist_static"
*.node[*].appl.dynamicRouting = false
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-MistAStar-verified.csv"
*.node[*].appl.routingLogPath = "../../artifacts/logs/routing-MistAStar-verified.csv"

[Config MistDynamicAStar]
extends = Default
*.metrics.mobilityLogPath = "../../artifacts/logs/mobility-MistDynamicAStar-verified.csv"
*.tls[*].controller.trafficLightLogPath = "../../artifacts/logs/traffic-light-MistDynamicAStar-verified.csv"
*.node[*].appl.routingMode = "mist_dynamic"
*.node[*].appl.dynamicRouting = true
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-MistDynamicAStar-verified.csv"
*.node[*].appl.routingLogPath = "../../artifacts/logs/routing-MistDynamicAStar-verified.csv"

[Config MistDynamicFogFallback]
extends = Default
*.metrics.mobilityLogPath = "../../artifacts/logs/mobility-MistDynamicFogFallback-verified.csv"
*.tls[*].controller.trafficLightLogPath = "../../artifacts/logs/traffic-light-MistDynamicFogFallback-verified.csv"
*.node[*].appl.routingMode = "mist_fallback"
*.node[*].appl.dynamicRouting = true
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-MistDynamicFogFallback-verified.csv"
*.node[*].appl.routingLogPath = "../../artifacts/logs/routing-MistDynamicFogFallback-verified.csv"

[Config NoPreemptionBaseline]
extends = FogCloudAStar
*.node[*].appl.preemptionEnabled = false
*.metrics.mobilityLogPath = "../../artifacts/logs/mobility-NoPreemptionBaseline-verified.csv"
*.tls[*].controller.trafficLightLogPath = "../../artifacts/logs/traffic-light-NoPreemptionBaseline-verified.csv"
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-NoPreemptionBaseline-verified.csv"
*.node[*].appl.routingLogPath = "../../artifacts/logs/routing-NoPreemptionBaseline-verified.csv"

[Config ForcedMistFailure]
extends = MistDynamicFogFallback
sim-time-limit = 120s
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-ForcedMistFailure-verified.csv"
*.node[*].appl.routingLogPath = "../../artifacts/logs/routing-ForcedMistFailure-verified.csv"
*.metrics.mobilityLogPath = "../../artifacts/logs/mobility-ForcedMistFailure-verified.csv"
*.tls[*].controller.trafficLightLogPath = "../../artifacts/logs/traffic-light-ForcedMistFailure-verified.csv"
*.node[*].appl.forceMistFailure = true
*.node[*].appl.fallbackLogPath = "../../artifacts/logs/fallback-forced-verified.csv"

[Config ForcedMistTimeout]
extends = MistDynamicFogFallback
sim-time-limit = 120s
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-ForcedMistTimeout-verified.csv"
*.node[*].appl.routingLogPath = "../../artifacts/logs/routing-ForcedMistTimeout-verified.csv"
*.metrics.mobilityLogPath = "../../artifacts/logs/mobility-ForcedMistTimeout-verified.csv"
*.tls[*].controller.trafficLightLogPath = "../../artifacts/logs/traffic-light-ForcedMistTimeout-verified.csv"
*.node[*].mist.routeBaseDelay = 1200ms
*.node[*].appl.fallbackLogPath = "../../artifacts/logs/fallback-timeout-verified.csv"



[Config CongestionReroute]
extends = MistDynamicAStar
sim-time-limit = 300s
*.manager.launchConfig = xmldoc("grid-congestion.launchd.xml")
*.**.appl.eventLogPath = "../../artifacts/logs/emergency-CongestionReroute-stable.csv"
*.node[*].appl.routingLogPath = "../../artifacts/logs/routing-CongestionReroute-stable.csv"
*.metrics.mobilityLogPath = "../../artifacts/logs/mobility-CongestionReroute-stable.csv"
*.tls[*].controller.trafficLightLogPath = "../../artifacts/logs/traffic-light-CongestionReroute-stable.csv"

[Config WithBeaconing]
*.rsu[*].appl.sendBeacons = true
*.node[*].appl.sendBeacons = true

[Config WithChannelSwitching]
*.**.nic.mac1609_4.useServiceChannel = true
*.node[*].appl.dataOnSch = true
*.rsu[*].appl.dataOnSch = true

